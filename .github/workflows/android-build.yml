name: Android Build & Release

on:
  push:
    branches: [ "main", "android-app" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Generate Gradle Wrapper (creates ./android/gradlew)
      working-directory: ./android
      run: gradle wrapper --gradle-version 8.4 --distribution-type bin

    - name: Grant execute permission for gradlew
      working-directory: ./android
      run: chmod +x gradlew

    - name: Decode Keystore (if available)
      working-directory: ./android
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$ENCODED_KEYSTORE" ]; then
          echo "$ENCODED_KEYSTORE" | base64 -d > app/release.keystore
          echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
        else
          echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
        fi

    - name: Build Release APK (signed)
      if: env.HAS_KEYSTORE == 'true'
      working-directory: ./android
      env:
        KEYSTORE_PATH: app/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Build Debug APK (no keystore)
      if: env.HAS_KEYSTORE != 'true'
      working-directory: ./android
      run: |
        echo "No keystore configured — building debug APK..."
        ./gradlew assembleDebug --no-daemon

    - name: List built APK files
      run: find android/app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "No APK files found"

    - name: Upload Debug APK
      if: env.HAS_KEYSTORE != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: CrisisConnect-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload Release APK
      if: env.HAS_KEYSTORE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: CrisisConnect-Release-APK
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 30
