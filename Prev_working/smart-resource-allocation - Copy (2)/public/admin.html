<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="box">
    <h1>Admin Dashboard</h1>
    <button id="seedDataBtn" style="background: linear-gradient(135deg, var(--warning), #D97706); width: auto; padding: 10px 20px;">Seed Dummy Volunteers</button>
  </div>
  <div class="box">
    <h2>Analytics</h2>
    <div id="analyticsMap" style="height: 300px; margin-bottom: 20px;"></div>
    <label>Show data for:
      <select id="mapTimeFilter">
        <option value="all">All Time</option>
        <option value="month">This Month</option>
        <option value="year">This Year</option>
      </select>
    </label>
    <div style="display:flex;flex-wrap:wrap;gap:30px;">
      <div style="flex:1;min-width:350px;position:relative;height:300px;">
        <canvas id="skillsChart" width="350" height="200"></canvas>
      </div>
      <div style="flex:1;min-width:350px;position:relative;height:300px;">
        <canvas id="urgencyChart" width="350" height="200"></canvas>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:30px;">
      <div style="flex:1;min-width:350px;position:relative;height:300px;">
        <canvas id="volunteersPerMonthChart" width="350" height="200"></canvas>
      </div>
      <div style="flex:1;min-width:350px;position:relative;height:300px;">
        <canvas id="ngoRequirementChart" width="350" height="200"></canvas>
      </div>
      <div style="flex:1;min-width:350px;position:relative;height:300px;">
        <canvas id="requirementFulfilledChart" width="350" height="200"></canvas>
      </div>
    </div>
  </div>
  <div class="box">
    <h2>All Completed Matches</h2>
    <input type="text" id="searchInput" placeholder="Search by volunteer, NGO, or need type..." style="width: 300px; padding: 8px; margin-bottom: 10px;" />
    <button id="sortBtn">Sort by Date</button>
    <ul id="adminMatchesList"></ul>
  </div>
  <div class="box">
    <h2>All NGO Applications</h2>
    <ul id="ngoList"></ul>
  </div>
  <div class="box">
    <h2>All Volunteer Applications</h2>
    <ul id="volunteerList"></ul>
  </div>
    <div class="box" id="manualMatchBox" style="background:#f9f9f9; border:2px solid #ccc; margin-bottom:20px;">
      <h2>Manual Matching</h2>
      <div id="selectedPairDisplay" style="margin-bottom:10px;"></div>
      <div id="manualMatchInstructions" style="color:#444; font-size:1em; margin-bottom:10px;">
        <b>Step 1:</b> Select an NGO request below.<br>
        <b>Step 2:</b> Select a volunteer to pair.<br>
        <b>Step 3:</b> Click "Create Match" when both are selected.
      </div>
      <button id="createManualMatchBtn" style="display:none; margin-bottom:10px;">Create Match</button>
      <button id="clearManualMatchBtn" style="display:none; margin-left:10px;">Clear Selection</button>
    </div>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
