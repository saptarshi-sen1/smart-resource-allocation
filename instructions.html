<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructions - CrisisConnect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🆘</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <div class="top-controls">
    <div id="google_translate_element"></div>
    <div class="theme-controls">
      <span class="theme-icon">🌞</span>
      <label class="theme-switch">
        <input type="checkbox" id="themeToggle" onchange="handleThemeToggle(this.checked)">
        <span class="slider"></span>
      </label>
      <span class="theme-icon">🌙</span>
    </div>
  </div>

  <script src="theme.js"></script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,hi,bn', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <header class="landing-header">
    <a href="index.html" class="logo">CrisisConnect</a>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <nav class="landing-nav" id="landingNav">
      <a href="index.html">Home</a>
      <a href="motive.html">Our Motive</a>
      <a href="instructions.html">Instructions</a>
      <a href="contact.html">Contact Us</a>
      <a href="dashboard.html" class="btn primary-btn" style="width: auto; margin-left: 1rem;">Login</a>
    </nav>
  </header>

  <main class="container" style="padding-top: 10rem;">
    <div class="card">
        <h1>Platform Instructions</h1>
        <div class="dynamic-content" id="instructionsContent" style="margin-top: 2rem;">
          <div class="spinner"></div> Loading...
        </div>
    </div>
  </main>

  <footer>
    Developed by Saptarshi Sen | Contact: <a href="mailto:saptarshi.sensxcs@gmail.com">saptarshi.sensxcs@gmail.com</a>
  </footer>

  <script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    
    async function loadContent() {
      try {
        const snap = await getDoc(doc(db, "siteContent", "instructions"));
        if (snap.exists() && snap.data().text) {
          document.getElementById("instructionsContent").innerHTML = snap.data().text.replace(/\n/g, "<br>");
        } else {
          document.getElementById("instructionsContent").innerHTML = `
            <strong>For Volunteers:</strong><br>
            1. Register and fill out your skills and location.<br>
            2. Share your Secret PIN with NGOs to confirm your availability.<br>
            3. Track your assignments from the dashboard.<br><br>
            <strong>For NGOs:</strong><br>
            1. Register your organization.<br>
            2. Submit requests with detailed needs and locations.<br>
            3. Use the AI Matcher or search manually for volunteers.
          `;
        }
      } catch(err) {
        document.getElementById("instructionsContent").innerText = "Failed to load content.";
      }
    }
    loadContent();
  </script>
</body>
</html>
