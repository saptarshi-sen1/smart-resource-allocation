<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Resource Allocation</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .role-btn { 
        margin: 15px; 
        padding: 20px 40px; 
        font-size: 1.2rem; 
        width: 300px;
    }
    .role-container { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 80vh; 
    }
    .main-box {
        text-align: center;
        max-width: 600px;
        margin: 0 auto;
    }
    p.subtitle {
        color: var(--text-muted);
        margin-bottom: 30px;
        font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="role-container">
    <div class="box main-box">
        <h1>Smart Resource Allocation</h1>
        <p class="subtitle">Disaster-Response Volunteer Matching Platform connecting NGOs with volunteers in real time.</p>
        <button class="role-btn" onclick="window.location.href='volunteer.html'">I am a Volunteer</button><br>
        <button class="role-btn" onclick="window.location.href='ngo.html'">I am an NGO</button><br>
        <button class="role-btn" onclick="window.location.href='admin.html'" style="background: linear-gradient(135deg, var(--secondary), #059669);">Admin Dashboard</button>
    </div>
  </div>
</body>
</html>
