<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Motive - CrisisConnect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🆘</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding: 0; background: #0F172A; }
    .landing-header {
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
      position: fixed; width: 100%; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 4rem; border-bottom: 1px solid var(--border-color);
    }
    .landing-nav a {
      color: var(--text-main); text-decoration: none; margin: 0 1rem;
      font-weight: 500; transition: color 0.2s;
    }
    .landing-nav a:hover { color: #60A5FA; }
    .content-page { padding: 10rem 4rem 4rem; max-width: 900px; margin: 0 auto; min-height: 80vh;}
    .content-page h1 { font-size: 3rem; margin-bottom: 2rem; text-align: left;}
    .dynamic-content { font-size: 1.2rem; line-height: 1.8; color: var(--text-main); }
    footer { text-align: center; padding: 2rem; background: #020617; border-top: 1px solid var(--border-color); color: var(--text-muted); }
    footer a { color: #60A5FA; text-decoration: none; }
  </style>
</head>
<body class="dark-theme">
  <div class="top-controls" style="position:fixed; width:100%; top:0; z-index:200; background:var(--card-bg); border-bottom:1px solid var(--border-color);">
    <div id="google_translate_element"></div>
    <div style="display:flex; align-items:center; gap: 10px;">
      <span style="font-size: 0.9rem; color: var(--text-main);">Dark Theme</span>
      <label class="theme-switch">
        <input type="checkbox" id="themeToggle" checked onchange="document.body.classList.toggle('dark-theme', this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,hi,bn', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <header class="landing-header" style="margin-top: 40px;">
    <h1 class="logo" style="margin:0; font-size: 1.8rem;">CrisisConnect</h1>
    <nav class="landing-nav">
      <a href="index.html">Home</a>
      <a href="motive.html">Our Motive</a>
      <a href="instructions.html">Instructions</a>
      <a href="contact.html">Contact Us</a>
      <a href="dashboard.html" class="btn primary-btn" style="margin: 0 0 0 1rem; padding: 0.6rem 1.2rem; display: inline-block;">Login to Platform</a>
    </nav>
  </header>

  <main class="content-page">
    <h1>Our Motive</h1>
    <div class="box dynamic-content" id="motiveContent">
      <div class="spinner"></div> Loading...
    </div>
  </main>

  <footer>
    Developed by Saptarshi Sen | Contact: <a href="mailto:saptarshi.sensxcs@gmail.com">saptarshi.sensxcs@gmail.com</a>
  </footer>

  <script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    
    async function loadContent() {
      try {
        const snap = await getDoc(doc(db, "siteContent", "motive"));
        if (snap.exists() && snap.data().text) {
          document.getElementById("motiveContent").innerHTML = snap.data().text.replace(/\n/g, "<br>");
        } else {
          document.getElementById("motiveContent").innerText = "Our primary motive is to bridge the gap between NGOs and willing volunteers during times of crisis. Every second counts, and our AI-driven platform ensures swift, accurate resource allocation.";
        }
      } catch(err) {
        document.getElementById("motiveContent").innerText = "Failed to load content.";
      }
    }
    loadContent();
  </script>
</body>
</html>
